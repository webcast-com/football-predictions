# Base44 dev environment for Predikt.
# Runs the app FROM THE CLONED SOURCE with live-reload (next dev) so edits appear instantly.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: node:22-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      # Anonymous volumes keep node_modules and .next container-local
      # so the bind mount doesn't shadow them with host (empty) dirs.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      # Local infra — generated by us, not a user secret.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db
      # Derived from sandbox env for canonical URLs / OG tags.
      - NEXT_PUBLIC_SITE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Passed through so next.config.ts allowedDevOrigins can reference it.
      - BASE44_PUBLIC_HOST_SUFFIX
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env      # platform secrets — LAST, always wins
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"

volumes:
  pgdata:
